<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Square rasters: tabs and app-icon slots letterbox rather than stretch the wide PMW ellipse. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://login.microsoftonline.com" />
    <link rel="preconnect" href="https://graph.microsoft.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0078D4" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <!--
      Keep every directive here in step with the Content-Security-Policy header in
      vercel.json. A page carrying both gets the *intersection* of the two, so a
      directive missing here is enforced as `default-src 'self'` no matter how
      permissive the header is — which is what silently blocked SharePoint video
      until `media-src` was added.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' data: blob: https://*.sharepoint.com https://*.microsoftonline.com https://*.microsoft.com https://graph.microsoft.com wss://*.sharepoint.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.sharepoint.com https://*.sharepointonline.com; frame-src 'self' https://*.sharepoint.com https://*.officeapps.live.com https://*.office.com https://login.microsoftonline.com;" />
    <title>PMW HR Group Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
